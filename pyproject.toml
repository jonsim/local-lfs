[project]
name = "local-lfs-dev-workspace"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "pre-commit==4.5.1",
    "robotframework==7.4.2",
    "robotframework-robocop==8.8.0",
    "ruff==0.16.7",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
